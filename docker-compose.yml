services:
  db:
    image: postgres:16-alpine
    container_name: suiteencript_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # 5433 en el host, no 5432: ya hay otro Postgres (de otro proyecto)
      # usando el 5432 en esta máquina.
      - "5433:5432"
    volumes:
      - suiteencript_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: suiteencript_redis
    restart: unless-stopped
    # Backend compartido de Flask-Limiter (Fase 7): sin esto, cada worker de
    # gunicorn llevaría su propio contador en memoria y el rate-limit real
    # sería (límite configurado × cantidad de workers) en vez del límite
    # real. Sin persistencia a disco a propósito — los contadores de rate
    # limit no necesitan sobrevivir un reinicio, son ventanas de minutos/horas.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: suiteencript_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Dentro de la red de Docker, la base de datos no es "localhost:5433"
      # (eso es solo el mapeo hacia el host) — es el nombre del servicio,
      # "db", en su puerto interno real, 5432.
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY}
      # Igual que con la base de datos: dentro de la red de Docker el
      # servicio se llama "redis", no "localhost".
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
      # false aquí a propósito: sin un proxy real por delante (eso es
      # trabajo de Render en la Fase 8), forzar HTTPS localmente solo
      # rompería las pruebas — ver la nota de ProxyFix en el ROADMAP.
      FORCE_HTTPS: "false"
      # Opcionales (Fase 8): si no están en tu .env, llegan como cadenas
      # vacías y storage.py cae solo al disco local (volumen de abajo) —
      # mismo criterio "todo o nada" que en Render, ver DEPLOY.md. Sirve
      # para probar el backend S3 real (Supabase Storage) desde Docker
      # local antes de desplegar, sin tener que cambiar nada de este archivo.
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-}
    ports:
      - "5000:5000"
    volumes:
      - suiteencript_uploads:/app/app/uploads

volumes:
  suiteencript_pgdata:
  suiteencript_uploads:
