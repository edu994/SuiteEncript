{% extends "base.html" %}
{% block title %}SuiteEncript - Iniciar sesión{% endblock %}
{% block navbar %}{% endblock %}
{% block body %}
<main id="main-content" class="se-page-narrow">
    <div class="se-auth-header">
        <a href="/" class="se-brand">SuiteEncript</a>
        <div class="se-status">Conexión cifrada</div>
    </div>

    <div class="se-card">
        <h2 class="se-card-title se-card-title-center">Acceder a tu cuenta</h2>

        {% include "_flashes.html" %}

        <form action="{{ url_for('auth.login') }}" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="se-form-group">
                <label for="username">Usuario o email</label>
                <input type="text" id="username" name="username" class="se-input" autocomplete="username" required placeholder="ej. maria92 o maria@ejemplo.com">
            </div>
            <div class="se-form-group">
                <label for="password">Contraseña maestra</label>
                <div class="se-password-group">
                    <input type="password" id="password" name="password" class="se-input" autocomplete="current-password" required placeholder="••••••••••••">
                    <button type="button" class="se-peek-password" data-se-peek-password="password" aria-label="Mantén pulsado para ver la contraseña">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
                <div class="se-text-muted se-text-xs se-mt-sm"><a href="{{ url_for('auth.forgot_password') }}">¿Olvidaste tu contraseña?</a></div>
            </div>
            <button type="submit" class="se-btn se-btn-primary se-btn-block">Iniciar sesión</button>
        </form>

        <div class="se-form-footer">
            ¿Todavía no tienes cuenta?<br>
            <a href="{{ url_for('auth.register') }}">Crea una</a>
        </div>
    </div>
</main>
{% endblock %}
