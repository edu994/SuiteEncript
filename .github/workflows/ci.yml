name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests (pytest, con cobertura — SQLite en memoria, no toca ninguna base de datos real)
        # python -m pytest, no solo "pytest": -m agrega el directorio del
        # proyecto a sys.path automáticamente, que es lo que deja resolver
        # "from app.models import ..." en tests/conftest.py. Con "pytest" a
        # secas, ese import falla (comprobado: así fue como se rompió aquí).
        run: python -m pytest

  security:
    name: Escaneo de seguridad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: bandit (patrones de código inseguro)
        run: bandit -r app main.py -ll
      - name: pip-audit (vulnerabilidades conocidas en dependencias)
        run: pip-audit -r requirements.txt

  docker-build:
    name: Build de la imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t suiteencript-app:ci .
